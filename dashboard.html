<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Unlimited Accounts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="dashboard.css">
  <script src="accent-boot.js"></script>
</head>
<body>
  <div class="container">
    <header class="dash-header">
      <div class="wordmark">
        <span class="wordmark-square" aria-hidden="true"></span>
        <h1 class="dash-title">Dashboard</h1>
      </div>
      <div class="dash-actions">
        <button id="unread-refresh" class="btn btn-secondary dash-btn">
          <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          Refresh Unread
        </button>
        <button id="stats-refresh-all" class="btn btn-secondary dash-btn">
          <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
          Refresh All
        </button>
      </div>
    </header>
    <p id="stats-updated" class="dash-updated">No stats yet</p>

    <div id="dashboard-list" class="dashboard-list"></div>

    <div id="message" class="message hidden" role="status"></div>
  </div>

  <script src="icons.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
